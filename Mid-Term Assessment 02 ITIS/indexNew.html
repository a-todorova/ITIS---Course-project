<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Measurement Station</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="c:\Users\User\Desktop\Mid-Term Assessment 02\css\styles.css">
</head>
<body>
  <div class="top-bar d-flex align-items-center px-4">
    <div class="flex-grow-1 text-center">
        <h2 class="mb-1">Measurement Station</h2>
        <div class="subheader">Developed by: Amanda Todorova, FIT, SSAI</div>
    </div>
    <img src="C:\Users\User\Desktop\Mid-Term Assessment 02\images\Tu-sofia-logo.svg" alt="TU Sofia Logo" style="max-height: 70px;">
  </div>
  
  <div class="container mt-4">
    <div class="row">
      <!-- Temperature Panel -->
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="text-center">Temperature</h5>
          <canvas id="tempCanvas" width="320" height="320"></canvas>
        </div>
      </div>

      <!-- Pressure Panel -->
      <div class="col-md-4">
        <div class="card p-3">
          <h5 style="text-align: center; width: 100%;">Pressure </h5>
          <canvas id="pressureCanvas" width="320" height="320"></canvas>
        </div>
      </div>

      <!-- CO Panel -->
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="text-center">CO detection</h5>
          <canvas id="coCanvas" width="320" height="320"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="c:\Users\User\Desktop\Mid-Term Assessment 02\js\script.js"></script>
</body>
</html>
